# Default pipeline: what `rag-index`, `rag-ask` and `rag-serve` use.
# Every value here is justified in README "Design decisions".
data_dir: data
index_dir: models/index          # Chroma persistent store + chunk JSONL per strategy

corpus:
  ros2_commit: 0ea463a2b27865c93acc928eccd2276e47c9f71c   # ros2/ros2_documentation, branch jazzy
  exclude_globs:                 # machine-generated changelogs: 100k+ words of package lists
    - "Releases/*Complete-Changelog*"
    - "_internal/*"
  pdf_dir: data/pdfs

chunking:
  strategy: section              # fixed | recursive | section
  max_words: 180                 # ~240 tokens: small enough to be specific, big enough for a code block
  overlap_words: 40              # only used by `fixed`
  section_header: true           # `section` only: prefix each chunk with "Doc > Section > Sub"

embedding:
  model: BAAI/bge-small-en-v1.5  # 384-d, 33 M params, MIT
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64

retrieval:
  mode: hybrid_rerank            # bm25 | dense | hybrid | hybrid_rerank
  candidates: 30                 # per retriever, before fusion
  rrf_k: 60                      # reciprocal-rank-fusion constant (Cormack et al. 2009)
  rerank_top: 30                 # fused candidates the cross-encoder re-scores
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 5                       # passages handed to the LLM

generation:
  model: claude-opus-5-5
  effort: low                    # grounded Q&A over 5 short passages; low keeps latency and cost down
  max_tokens: 4000
