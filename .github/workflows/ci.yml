name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Tests use a hashing embedder, a fake reranker and a mocked Claude client:
      # no PyTorch, no model download, no corpus and no API key needed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml tqdm pypdf rank-bm25 chromadb anthropic python-dotenv \
            fastapi uvicorn httpx matplotlib pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t robotics-docs-rag:ci .
      - name: Smoke-test the CLI inside the image
        run: docker run --rm --entrypoint rag-ask robotics-docs-rag:ci --help
