<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the ROS 2 docs</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --accent:#22577a; --line:#e3e3e6; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .banner { background:#fff4d6; border:1px solid #f0d58c; padding:8px 12px; border-radius:8px; margin-bottom:16px; display:none; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:12px 0; }
  .q { background:#e8f0f6; border-color:#cfe0ec; }
  .answer { white-space: pre-wrap; }
  .cite { color:var(--accent); font-weight:600; cursor:pointer; text-decoration:none; }
  .passage { border-top:1px solid var(--line); padding:8px 0; font-size:13px; }
  .passage.cited { background:#f2f8fc; }
  .passage summary { cursor:pointer; }
  .passage pre { white-space:pre-wrap; font-size:12px; color:#333; margin:6px 0 0; }
  .meta { color: var(--muted); font-size:12px; }
  form { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 16px; }
  .row { max-width:860px; margin:0 auto; display:flex; gap:8px; }
  input[type=text] { flex:1; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:8px; min-width:0; }
  select, button { padding:10px 12px; border-radius:8px; border:1px solid var(--line); font-size:14px; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button:disabled { opacity:.5; }
  code { background:#f0f0f2; padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>
<main>
  <h1>Ask the ROS 2 docs</h1>
  <p class="sub">Hybrid search (BM25 + embeddings) → cross-encoder rerank → Claude answer with citations.</p>
  <div class="banner" id="banner">No <code>ANTHROPIC_API_KEY</code> on the server: you will get the retrieved passages, not a written answer.</div>
  <div id="log"></div>
</main>
<form id="form">
  <div class="row">
    <input type="text" id="q" placeholder="e.g. How do I make late subscribers receive the last message?" autocomplete="off" required maxlength="1000">
    <select id="mode" title="retrieval mode">
      <option value="hybrid_rerank">hybrid + rerank</option>
      <option value="hybrid">hybrid</option>
      <option value="dense">dense</option>
      <option value="bm25">BM25</option>
    </select>
    <button id="go">Ask</button>
  </div>
</form>
<script>
const log = document.getElementById("log");
fetch("health").then(r => r.json()).then(h => {
  if (!h.llm_enabled) document.getElementById("banner").style.display = "block";
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Render the answer as text nodes, turning [n] into links to passage n (no innerHTML).
function renderAnswer(text, id) {
  const div = el("div", "answer");
  const parts = text.split(/(\[\d+(?:\s*,\s*\d+)*\])/g);
  for (const p of parts) {
    const m = p.match(/^\[(\d+(?:\s*,\s*\d+)*)\]$/);
    if (!m) { div.appendChild(document.createTextNode(p)); continue; }
    m[1].split(",").forEach((n) => {
      const a = el("a", "cite", `[${n.trim()}]`);
      a.href = `#${id}-p${n.trim()}`;
      div.appendChild(a);
    });
  }
  return div;
}

document.getElementById("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = document.getElementById("q");
  const question = q.value.trim();
  if (!question) return;
  const btn = document.getElementById("go");
  btn.disabled = true;
  log.appendChild(el("div", "msg q", question));
  const box = el("div", "msg", "Searching…");
  log.appendChild(box);
  box.scrollIntoView({behavior: "smooth"});
  try {
    const r = await fetch("ask", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question, mode: document.getElementById("mode").value})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    box.textContent = "";
    const id = "a" + Date.now();
    box.appendChild(renderAnswer(data.answer, id));
    const cited = new Set(data.citations);
    const meta = data.llm_used
      ? `${data.model} · ${Math.round(data.latency_ms)} ms answer · ${data.usage.retrieval_ms} ms retrieval`
      : `retrieval ${data.usage.retrieval_ms} ms`;
    box.appendChild(el("div", "meta", meta));
    for (const p of data.passages) {
      const d = el("details", "passage" + (cited.has(p.n) ? " cited" : ""));
      d.id = `${id}-p${p.n}`;
      const s = el("summary", "", `[${p.n}] ${p.section}${p.page ? " (p. " + p.page + ")" : ""}`);
      d.appendChild(s);
      const link = el("a", "meta", p.source);
      if (p.source.startsWith("http")) { link.href = p.source; link.target = "_blank"; link.rel = "noopener"; }
      d.appendChild(link);
      d.appendChild(el("pre", "", p.text));
      box.appendChild(d);
    }
  } catch (e) {
    box.textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
    q.value = "";
    q.focus();
  }
});
</script>
</body>
</html>
